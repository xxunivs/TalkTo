services:
  - type: web
    name: talkto-persona-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: ft:gpt-4.1-mini-2025-04-14:talkto::DeJqGFij
      - key: PERSONA_ENABLE_LOCAL_SHORT_TERM
        value: "false"
      - key: AI_SERVER_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
