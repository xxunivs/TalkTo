[project]
name = "talkto-api-server"
version = "0.1.0"
description = "TalkTo API server"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  # 운영 저장소(S3). EC2 IAM 역할로 인증한다(app/services/storage.py S3Storage)
  "boto3>=1.35,<2",
  "dnspython>=2.6,<3",
  "email-validator>=2.2,<3",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.44,<3",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
